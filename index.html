<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LogiTrack: operación de flota, envíos, rutas y seguimiento en vivo." />
    <meta name="theme-color" content="#0E1B33" />
    <title>LogiTrack</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello.
      try {
        var t = localStorage.getItem('logitrack.tema');
        var oscuro = t === 'oscuro' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
